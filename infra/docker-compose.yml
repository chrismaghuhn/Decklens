version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mtg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mtg_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mtg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Adminer for quick DB inspection (optional but helpful)
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  postgres_data:
  redis_data:

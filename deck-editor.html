<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeckLens Deckbuilder - Deck Editor</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    connect-src 'self' https://api.scryfall.com https://api2.moxfield.com https://archidekt.com;
    img-src 'self' data: https:;
    font-src 'self' data: https://fonts.gstatic.com;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
  "
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <link rel="stylesheet" href="/src/styles/playmat.css" />
  </head>
  <body>
    <a class="skip-link" href="#pmMat">Skip to playmat</a>

    <header id="pmHeader" class="pm-header" aria-label="Deck header"></header>
    <div id="pmSortbar" class="pm-sortbar" aria-label="Sortieren und Statuswerte"></div>
    <main id="pmMat" class="pm-mat" aria-label="Playmat"></main>
    <div id="pmHand" class="pm-hand" aria-label="Suchergebnisse"></div>
    <div id="pmActions" class="pm-actions" aria-label="Werkzeuge"></div>
    <div id="pmDrawer" class="pm-drawer" aria-hidden="true"></div>

    <div id="legalFooterContainer"></div>

    <script type="module" src="/src/playmat/main.ts"></script>
    <script type="module">
      import { renderLegalFooter, injectLegalFooterStyles } from '/src/shared/legal-footer.ts';
      injectLegalFooterStyles();
      renderLegalFooter(document.getElementById('legalFooterContainer'));
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeckLens Deckbuilder - My Decks</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    connect-src 'self' https://decklens-api.chrisgarkisch.workers.dev;
    img-src 'self' data: https:;
    font-src 'self' data: https://fonts.gstatic.com;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
  " />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --void: #08090f;
      --abyss: #0c0e16;
      --obsidian: #12141e;
      --smoke: #1a1d2a;
      --slate: #252838;
      --line: rgba(255,255,255,0.06);
      --line-light: rgba(255,255,255,0.10);

      --gold: #c9a84c;
      --gold-bright: #e8c84a;
      --gold-dim: #8a7230;
      --gold-glow: rgba(201,168,76,0.12);
      --emerald: #34d399;
      --emerald-glow: rgba(52,211,153,0.10);
      --accent: #34d399;
      --crimson: #ef4444;
      --crimson-glow: rgba(239,68,68,0.12);

      --text: #e8e2d6;
      --text-dim: #9a94a8;
      --muted: #706b7f;

      --danger: #ef4444;
      --panel: rgba(18,20,30,0.85);
      --input-bg: rgba(8,9,15,0.6);

      --radius: 12px;
      --radius-sm: 8px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--void);
      color: var(--text);
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Atmospheric background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 900px 500px at 15% -5%, rgba(201,168,76,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 700px 400px at 85% 20%, rgba(52,211,153,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 1200px 800px at 50% 100%, rgba(18,20,30,0.5) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Noise texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--void); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    /* ═══ LAYOUT ═══ */
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }

    .top {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .top h1 {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 50%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ═══ PANEL ═══ */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      backdrop-filter: blur(12px);
      position: relative;
    }
    .panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 1px;
      background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, transparent 40%, transparent 60%, rgba(52,211,153,0.05) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ═══ TYPOGRAPHY ═══ */
    .muted { color: var(--muted); font-size: 0.84rem; }

    /* ═══ BUTTONS ═══ */
    .btn {
      border: 1px solid var(--line-light);
      background: var(--smoke);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.84rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: all 0.2s var(--ease);
      white-space: nowrap;
    }
    .btn:hover { background: var(--slate); border-color: rgba(255,255,255,0.14); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.primary {
      background: linear-gradient(135deg, rgba(52,211,153,0.15), rgba(52,211,153,0.08));
      border-color: rgba(52,211,153,0.25);
      color: var(--emerald);
    }
    .btn.primary:hover { background: linear-gradient(135deg, rgba(52,211,153,0.22), rgba(52,211,153,0.12)); border-color: rgba(52,211,153,0.4); }
    .btn.danger {
      background: rgba(239,68,68,0.08);
      border-color: rgba(239,68,68,0.2);
      color: #f87171;
    }
    .btn.danger:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.35); }

    /* ═══ INPUTS ═══ */
    input {
      background: var(--input-bg);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      min-width: 260px;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    input::placeholder { color: var(--muted); }
    input:focus {
      outline: none;
      border-color: rgba(201,168,76,0.35);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
    }

    /* ═══ CREATE ROW ═══ */
    .create-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    /* ═══ DECK ROWS ═══ */
    .deck-row {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(12,14,22,0.5);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
      flex-wrap: wrap;
      transition: all 0.2s var(--ease);
    }
    .deck-row:hover {
      background: rgba(18,20,30,0.7);
      border-color: var(--line-light);
      transform: translateX(2px);
    }
    .deck-row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 640px) {
      .wrap { padding: 16px; }
      .top h1 { font-size: 1.2rem; }
      input { min-width: 200px; }
      .create-row { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1 style="margin:0;">Deckbuilder - My Decks</h1>
      <a class="btn" href="/play">Bot Arena</a>
      <a class="btn" href="/">Back to Home</a>
    </div>

    <section class="panel">
      <p class="muted">Local-only MVP storage: decks stay on this device. Public/unlisted sharing creates immutable snapshots.</p>
      <div class="create-row">
        <input id="newDeckName" placeholder="New deck name" maxlength="100" />
        <button id="btnCreateDeck" class="btn primary">Create Deck</button>
        <button id="btnBrowsePublic" class="btn">Browse Public Decks</button>
      </div>
      <div id="decksList"></div>
    </section>
  </div>

  <script type="module" src="/src/deckbuilder/decks-main.ts"></script>
<script type="module" src="/src/shared/discord-popup.ts"></script>
</body>
</html>

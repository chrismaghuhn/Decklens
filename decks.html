<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeckLens Deckbuilder - My Decks</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    connect-src 'self' https://decklens-api.chrisgarkisch.workers.dev;
    img-src 'self' data: https:;
    font-src 'self' data: https://fonts.gstatic.com;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
  " />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/data-lab.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-weight: 400;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      border-top: 3px solid var(--cobalt);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--paper-dim); }
    ::-webkit-scrollbar-thumb { background: var(--ink-35); }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink); }

    /* ═══ LAYOUT ═══ */
    .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 64px; position: relative; z-index: 1; }

    .top {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--hairline);
    }
    .top .dl-label { display: block; margin-bottom: 6px; }
    .top h1 {
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .top h1 .accent { color: var(--cobalt); }

    /* ═══ PANEL ═══ */
    .panel {
      background: var(--paper-card);
      border: 1px solid var(--hairline);
      border-radius: 0;
      padding: 24px;
      position: relative;
    }
    .panel::before { content: none; }

    /* ═══ TYPOGRAPHY ═══ */
    .muted { color: var(--ink-50); font-size: 0.84rem; }
    .panel > .muted {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: var(--ink-50);
      border-left: 2px solid var(--cobalt);
      padding-left: 12px;
      margin-bottom: 20px;
    }

    /* ═══ BUTTONS ═══ */
    .btn {
      border: 1px solid var(--ink);
      background: var(--paper-card);
      color: var(--ink);
      border-radius: 0;
      padding: 9px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: var(--cobalt);
      border-color: var(--cobalt);
      color: #FFFFFF;
    }
    .btn.primary:hover { background: var(--cobalt-dark); border-color: var(--cobalt-dark); color: #FFFFFF; }
    .btn.danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }
    .btn.danger:hover { background: var(--danger); border-color: var(--danger); color: #FFFFFF; }

    /* ═══ INPUTS ═══ */
    input {
      background: var(--paper-card);
      border: 1px solid var(--hairline);
      color: var(--ink);
      border-radius: 0;
      padding: 10px 14px;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      min-width: 260px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input::placeholder { color: var(--ink-35); }
    input:focus {
      outline: none;
      border-color: var(--cobalt);
      box-shadow: 0 0 0 1px var(--cobalt);
    }

    /* ═══ CREATE ROW ═══ */
    .create-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    /* ═══ DECK ROWS ═══ */
    .deck-row {
      border: 1px solid var(--hairline);
      border-radius: 0;
      background: var(--paper-card);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
      flex-wrap: wrap;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .deck-row:hover {
      background: var(--cobalt-tint);
      border-color: var(--cobalt);
    }
    .deck-row-title strong {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--ink);
    }
    .deck-row-title .muted {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.02em;
      margin-top: 3px;
    }
    .deck-row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 640px) {
      .wrap { padding: 24px 16px 48px; }
      .top h1 { font-size: 1.25rem; }
      input { min-width: 200px; }
      .create-row { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <span class="dl-label">Deckbuilder / Local Storage</span>
        <h1>My <span class="accent">Decks</span></h1>
      </div>
      <a class="btn" href="/">Back to Home</a>
    </div>

    <section class="panel">
      <p class="muted">Local-only MVP storage: decks stay on this device. Public/unlisted sharing creates immutable snapshots.</p>
      <div class="create-row">
        <input id="newDeckName" placeholder="New deck name" maxlength="100" />
        <button id="btnCreateDeck" class="btn primary">Create Deck</button>
        <button id="btnBrowsePublic" class="btn">Browse Public Decks</button>
      </div>
      <div id="decksList"></div>
    </section>
  </div>

  <script type="module" src="/src/deckbuilder/decks-main.ts"></script>
<script type="module" src="/src/shared/discord-popup.ts"></script>
</body>
</html>
